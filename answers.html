<html lang="zh-Hant">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 18%, rgba(166, 122, 255, 0.35), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(91, 190, 255, 0.22), transparent 26%),
        radial-gradient(circle at 50% 88%, rgba(255, 220, 140, 0.12), transparent 35%),
        linear-gradient(180deg, #07031d 0%, #120728 48%, #03010a 100%);
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background-repeat: repeat;
      animation: starDrift 120s linear infinite;
    }

    .stars {
      background-image:
        radial-gradient(#ffffff 1px, transparent 1px),
        radial-gradient(#d9c7ff 1px, transparent 1px);
      background-size: 120px 120px, 230px 230px;
      opacity: 0.65;
    }

    .stars::before {
      background-image:
        radial-gradient(#fff3ba 1px, transparent 1px),
        radial-gradient(#99ddff 1px, transparent 1px);
      background-size: 180px 180px, 310px 310px;
      opacity: 0.45;
      animation-duration: 180s;
    }

    .stars::after {
      background-image:
        radial-gradient(rgba(255,255,255,0.85) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: 0.25;
      animation-duration: 220s;
    }

    @keyframes starDrift {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-360px);
      }
    }

    .moon {
      position: fixed;
      top: 7vh;
      right: 9vw;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 35%, #fff9d7, #dcc88b 58%, #8d7347 100%);
      box-shadow:
        0 0 36px rgba(255, 238, 173, 0.65),
        0 0 96px rgba(172, 130, 255, 0.35);
      opacity: 0.88;
    }

    .moon::after {
      content: "";
      position: absolute;
      top: 8px;
      left: -20px;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: #07031d;
      opacity: 0.45;
    }

    .mist {
      position: fixed;
      inset: auto -20vw -20vh -20vw;
      height: 45vh;
      background:
        radial-gradient(circle at 20% 40%, rgba(171, 135, 255, 0.16), transparent 28%),
        radial-gradient(circle at 70% 50%, rgba(110, 185, 255, 0.12), transparent 30%);
      filter: blur(24px);
      opacity: 0.8;
      pointer-events: none;
      animation: mistMove 12s ease-in-out infinite alternate;
    }

    @keyframes mistMove {
      from {
        transform: translateX(-3vw);
      }

      to {
        transform: translateX(3vw);
      }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
    }

    .altar {
      width: min(94vw, 560px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 0.12em;
      font-weight: 900;
      line-height: 1.25;
      text-shadow:
        0 0 12px rgba(221, 199, 255, 0.95),
        0 0 34px rgba(116, 82, 255, 0.75);
    }

    .subtitle {
      margin: 0 auto 22px;
      max-width: 460px;
      color: #ded3ff;
      line-height: 1.8;
      font-size: 15px;
      font-weight: 400;
      opacity: 0.92;
    }

    .button-zone {
      margin: 0 auto 24px;
    }

    .magic-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 114px;
      height: 114px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle, rgba(255, 241, 184, 0.25), rgba(129, 85, 255, 0.24), transparent 70%);
      box-shadow:
        0 0 24px rgba(255, 235, 170, 0.58),
        0 0 52px rgba(144, 96, 255, 0.7);
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .magic-button:hover {
      transform: translateY(-3px) scale(1.045);
      filter: brightness(1.18);
    }

    .magic-button:active {
      transform: scale(0.94);
    }

    .magic-button img {
      width: 94px;
      height: 94px;
      object-fit: contain;
      pointer-events: none;
      filter:
        drop-shadow(0 0 10px rgba(255, 236, 180, 0.95))

    }

    .button-text {
      margin-top: 14px;
      color: #ffedb2;
      letter-spacing: 0.14em;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 0 12px rgba(255, 225, 150, 0.48);
    }

    .card-wrap {
      position: relative;
      margin: 0 auto;
      width: min(82vw, 350px);
      height: min(118vw, 500px);
      max-height: 500px;
      perspective: 1200px;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 25px;
      transform-style: preserve-3d;
      transition: transform 950ms cubic-bezier(.18,.82,.28,1);
    }

    .card.revealed {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 25px;
      backface-visibility: hidden;
      overflow: hidden;
      border: 1px solid rgba(255, 235, 178, 0.56);
      box-shadow:
        0 0 0 2px rgba(155, 116, 255, 0.18),
        0 22px 65px rgba(0, 0, 0, 0.6),
        0 0 56px rgba(132, 83, 255, 0.38);
    }

    .card-back {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), transparent 34%),
        radial-gradient(circle at center, rgba(225, 200, 255, 0.24), transparent 36%),
        linear-gradient(180deg, #24114c, #080215);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 18px;
      border: 1px solid rgba(255, 230, 170, 0.56);
      box-shadow: inset 0 0 30px rgba(255, 230, 170, 0.16);
    }

    .sigil {
      position: relative;
      width: 185px;
      height: 185px;
      border-radius: 50%;
      border: 1px solid rgba(255, 238, 184, 0.9);
      box-shadow:
        0 0 24px rgba(255, 238, 184, 0.48),
        inset 0 0 26px rgba(130, 90, 255, 0.48);
      animation: pulse 3.8s ease-in-out infinite;
    }

    .sigil::before,
    .sigil::after {
      content: "";
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(196, 170, 255, 0.9);
      transform: rotate(45deg);
      box-shadow: 0 0 18px rgba(196, 170, 255, 0.45);
    }

    .sigil::after {
      inset: 52px;
      border-radius: 50%;
      transform: none;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.84;
      }

      50% {
        transform: scale(1.045);
        opacity: 1;
      }
    }

    .card-front {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 240, 181, 0.22), transparent 24%),
        radial-gradient(circle at 50% 50%, rgba(135, 92, 255, 0.23), transparent 45%),
        linear-gradient(180deg, #190b39, #05020f);
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 230, 170, 0.6);
      pointer-events: none;
    }

    .card-title {
      position: relative;
      color: #ffedb0;
      letter-spacing: 0.2em;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 225, 150, 0.65);

      position: relative;
      margin: auto 0;
      padding: 22px 8px;
      font-size: clamp(23px, 5.4vw, 32px);
      line-height: 1.58;
      font-weight: 500;
      color: #fffaf0;
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.36),
        0 0 25px rgba(150, 104, 255, 0.58);
    }

    .spark {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      background: #fff2b8;
      box-shadow:
        0 0 10px #fff2b8,
        0 0 22px #9b74ff;
      animation: fly 900ms ease-out forwards;
      z-index: 9;
    }

    @keyframes fly {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      to {
        transform: translate(var(--x), var(--y)) scale(0);
        opacity: 0;
      }
    }

    @media (max-height: 820px) {
      body {
        overflow-y: auto;
      }

      .page {
        align-items: flex-start;
        overflow-y: auto;
      }

      .card-wrap {
        height: 430px;
      }
    }
  </style>
</head>

  <script>
    const card = document.getElementById("card");
    const adviceText = document.getElementById("adviceText");
    const drawButton = document.getElementById("drawButton");
    const rawAdviceText = document.getElementById("advice-data").textContent;

    const ADVICES = rawAdviceText
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => line);

    function getTimeBasedIndex(timestamp) {
      let x = BigInt(timestamp);

      x ^= x << 13n;
      x ^= x >> 7n;
      x ^= x << 17n;

      if (x < 0n) {
        x = -x;
      }

      return Number(x % BigInt(ADVICES.length));
    }

    function createSparks(x, y) {
      for (let i = 0; i < 28; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";

        const angle = Math.random() * Math.PI * 2;
        const distance = 65 + Math.random() * 120;

        spark.style.left = x + "px";
        spark.style.top = y + "px";
        spark.style.setProperty("--x", Math.cos(angle) * distance + "px");
        spark.style.setProperty("--y", Math.sin(angle) * distance + "px");

        document.body.appendChild(spark);

        setTimeout(() => {
          spark.remove();
        }, 950);
      }
    }

    function drawAdvice() {
      if (!ADVICES.length) {
        adviceText.textContent = "牌庫尚未載入。";
        card.classList.add("revealed");
        return;
      }

      const now = new Date();
      const timestamp = now.getTime();
      const index = getTimeBasedIndex(timestamp);
      const advice = ADVICES[index];

      card.classList.remove("revealed");

      setTimeout(() => {
        adviceText.textContent = advice;
        card.classList.add("revealed");
      }, 260);

      const rect = drawButton.getBoundingClientRect();

      createSparks(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2
      );
    }

    drawButton.addEventListener("click", drawAdvice);

    console.log(`已載入 ${ADVICES.length} 條繁中建議。`);
  </script>
