<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港式生活</title>
  <style>
    /* Nature-Inspired Color Palette */
    :root {
      --color-bg: #F8F6F2;       /* Sand/Cream */
      --color-primary: #6B7F70;  /* Sage Green */
      --color-secondary: #C39E8F; /* Soft Terracotta */
      --color-text: #3D3D3D;     /* Warm Dark Gray */
      --color-subtle: #9EA39D;   /* Soft Grey-Green */
      --color-card-bg: #FFFFFF;
      --font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.6;
    }

    /* Journal/Card Styling */
    .journal-card {
      background: var(--color-card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(107, 127, 112, 0.1);
      padding: 40px 30px;
      transition: opacity 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 50px;
      height: 2px;
      background-color: var(--color-secondary);
      margin: 15px auto 0;
      border-radius: 2px;
    }

    h1 {
      font-size: 26px;
      color: var(--color-primary);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--color-subtle);
      font-size: 15px;
      margin-top: 8px;
      font-weight: 400;
    }

    .status-bar {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-primary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prompt-text {
      font-size: 19px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #EAEAE8;
      background-color: var(--color-card-bg);
      color: var(--color-text);
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      line-height: 1.5;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background-color: var(--color-secondary);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .option-btn:hover {
      border-color: var(--color-primary);
      background-color: #FAF9F7;
      color: var(--color-primary);
      transform: translateY(-2px);
    }

    .option-btn:hover::before {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

    /* Result View Layout */
    .result-view {
      text-align: left;
    }

    .result-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .result-intro {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .result-type {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.5px;
    }

    .image-container {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 auto 30px auto;
      background-color: #F1EFEA;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .section-block {
      background-color: #FDFBFA;
      border: 1px solid #F3ECE8;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .region-badge {
      display: inline-block;
      background-color: #E2E8E3;
      color: var(--color-primary);
      font-size: 13px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      margin-left: 6px;
    }

    .section-content {
      font-size: 15px;
      color: var(--color-text);
      line-height: 1.6;
    }

    .trait-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .trait-tag {
      background-color: #EFECE6;
      color: #555;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .advice-list {
      padding-left: 18px;
      margin-top: 8px;
    }

    .advice-list li {
      font-size: 14px;
      color: var(--color-text);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .action-row {
      text-align: center;
      margin-top: 30px;
    }

    .return-btn {
      background-color: var(--color-primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      letter-spacing: 1px;
    }

    .return-btn:hover {
      background-color: #5A6B5F;
      transform: scale(1.02);
    }

    @media (max-width: 500px) {
      .journal-card { padding: 30px 20px; }
      h1 { font-size: 22px; }
      .prompt-text { font-size: 17px; }
      .option-btn { font-size: 14px; padding: 14px; }
      .result-type { font-size: 24px; }
      .image-container { max-width: 260px; }
    }
  </style>
</head>
<body>

  <div class="journal-card">
    <header>
      <h1>放慢腳步</h1>
      <p class="subtitle">享受香港日常</p>
    </header>

    <!-- Exploration View (Questions) -->
    <div id="exploration-container">
      <div class="status-bar" id="question-status">情景 1 / 4</div>
      <div class="prompt-text" id="question-prompt"></div>
      <div class="options-stack" id="options-stack"></div>
    </div>

    <!-- Reflection View (Result) -->
    <div id="reflection-container" class="result-view hidden">
      <div class="result-header">
        <div class="result-intro">你的內在屬性為</div>
        <div class="result-type" id="result-type"></div>
      </div>

      <div class="image-container">
        <img id="result-image" src="" alt="Lifestyle Archetype Image">
      </div>

      <!-- Core Philosophy -->
      <div class="section-block">
        <div class="section-title">🌱 生活追求</div>
        <div class="section-content" id="result-philosophy"></div>
      </div>

      <!-- Recommended Region -->
      <div class="section-block">
        <div class="section-title">
          📍 出沒地區 <span class="region-badge" id="result-region"></span>
        </div>
        <div class="section-content" id="result-region-desc"></div>
      </div>

      <!-- Core Traits -->
      <div class="section-block">
        <div class="section-title">✨ 核心特質</div>
        <div class="trait-tag-list" id="result-traits"></div>
      </div>

      <!-- Actionable Advice -->
      <div class="section-block">
        <div class="section-title">🍃 生活實踐建議</div>
        <ol class="advice-list" id="result-advices"></ol>
      </div>

      <div class="action-row">
        <button class="return-btn" onclick="restartJourney()">重回旅程</button>
      </div>
    </div>
  </div>

        image: "learner.png",
        coreTraits: ["求知若渴", "好學不倦", "思想開放", "追求卓越"],

    let stepIndex = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0, I: 0 };

    function startStep() {
      const s = steps[stepIndex];
      document.getElementById('question-status').innerText = `情景 ${stepIndex + 1} / ${steps.length}`;
      document.getElementById('question-prompt').innerText = s.prompt;
      
      const optionsStack = document.getElementById('options-stack');
      optionsStack.innerHTML = '';

      s.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => recordEnergy(opt.type);
        optionsStack.appendChild(btn);
      });
    }

    function recordEnergy(type) {
      if (type && scores.hasOwnProperty(type)) {
        scores[type] += 1;
      }
      stepIndex++;

      const card = document.querySelector('.journal-card');
      card.style.opacity = '0';
      
      setTimeout(() => {
        if (stepIndex < steps.length) {
          startStep();
        } else {
          showReflection();
        }
        card.style.opacity = '1';
      }, 300);
    }

    function showReflection() {
      document.getElementById('exploration-container').classList.add('hidden');
      document.getElementById('reflection-container').classList.remove('hidden');

      let maxScore = -1;
      let topArchetypes = [];

      for (const [type, count] of Object.entries(scores)) {
        if (count > maxScore) {
          maxScore = count;
          topArchetypes = [type];
        } else if (count === maxScore) {
          topArchetypes.push(type);
        }
      }

      const primaryArchetype = topArchetypes[Math.floor(Math.random() * topArchetypes.length)];
      const data = database[primaryArchetype];

      document.getElementById('result-type').innerText = data.title;
      document.getElementById('result-image').src = data.image;
      document.getElementById('result-image').alt = data.title;
      document.getElementById('result-philosophy').innerText = data.philosophy;
      document.getElementById('result-region').innerText = data.region;
      document.getElementById('result-region-desc').innerText = data.regionDesc;

      const traitsContainer = document.getElementById('result-traits');
      traitsContainer.innerHTML = '';
      data.coreTraits.forEach(trait => {
        const tag = document.createElement('span');
        tag.className = 'trait-tag';
        tag.innerText = trait;
        traitsContainer.appendChild(tag);
      });

      const advicesContainer = document.getElementById('result-advices');
      advicesContainer.innerHTML = '';
      data.advices.forEach(adv => {
        const li = document.createElement('li');
        li.innerText = adv;
        advicesContainer.appendChild(li);
      });
    }

    function restartJourney() {
      stepIndex = 0;
      scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0, I: 0 };
      document.getElementById('reflection-container').classList.add('hidden');
      document.getElementById('exploration-container').classList.remove('hidden');
      startStep();
    }

    window.onload = startStep;
  </script>
